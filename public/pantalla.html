<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla · Capacitación MTPBA</title>
<style>
  :root{ --dark:#1E3A68; --band:#2B4E85; --cele:#56A8C2; --cele2:#7FD1EA; --light:#EAF4F9; --gray:#EEF2F7; --border:#DDE7EF;
         --ok:#2e7d4f; --bad:#b3402a; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',Arial,Helvetica,sans-serif;background:#fff;color:#22384f;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:var(--dark);color:#fff;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
  header:after{content:'';position:absolute;top:-90px;right:-60px;width:230px;height:230px;border-radius:50%;background:var(--band);z-index:0}
  header>*{position:relative;z-index:1}
  header .t1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#9EC9DD;font-weight:bold}
  header .t2{font-size:22px;font-weight:bold}
  header .right{text-align:right;font-size:16px}
  main{flex:1;padding:28px 40px;overflow:hidden;display:flex;flex-direction:column}
  .bloque{display:inline-block;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:#2B6C8C;font-weight:bold;background:var(--light);border-radius:14px;padding:7px 18px}
  h1{font-size:34px;color:var(--dark);margin:14px 0 22px;line-height:1.25}
  .waiting{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
  .waiting .big{font-size:40px;color:var(--dark);font-weight:bold}
  .waiting .url{font-size:30px;background:var(--dark);border:none;border-radius:20px;padding:16px 40px;color:#fff;font-weight:bold;box-shadow:0 10px 26px rgba(20,40,70,.3)}
  .counter{font-size:22px;color:#5a6b7d}
  .bars{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:1100px}
  .brow .lab{display:flex;justify-content:space-between;font-size:21px;margin-bottom:6px}
  .brow .lab .r{color:#5a6b7d}
  .bar{height:36px;background:var(--gray);border-radius:18px;overflow:hidden}
  .bar>div{height:100%;background:var(--cele);border-radius:18px;transition:width .45s;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;color:#fff;font-weight:bold;font-size:17px;min-width:44px}
  .bar>div.c{background:var(--ok)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1;align-content:center;max-width:1200px}
  .split h2{font-size:26px;margin-bottom:14px}
  .heat{width:100%;border-collapse:collapse;font-size:17px;max-width:1150px}
  .heat td,.heat th{border:1px solid var(--border);padding:9px 10px;text-align:center}
  .heat th{background:var(--dark);color:#fff}
  .heat td.lbl{text-align:left;font-size:16px}
  .cloud{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;max-width:1150px;margin:0 auto}
  .cloud span{padding:4px 10px}
  footer{background:var(--dark);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 30px;font-size:19px;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(20,40,70,.25)}
  .explain{background:var(--light);border-left:6px solid var(--cele);padding:14px 18px;font-size:19px;border-radius:0 10px 10px 0;margin-top:18px;max-width:1100px;line-height:1.4}
  .cloudC{position:relative; background:var(--dark); border-radius:26px; height:100%; overflow:hidden}
  .cloudC .deco1{position:absolute; top:-140px; right:-120px; width:380px; height:380px; border-radius:50%; background:var(--band)}
  .cloudC .deco2{position:absolute; bottom:-160px; left:-140px; width:420px; height:420px; border-radius:50%; background:var(--cele); opacity:.2}
  .cc-label{position:absolute; top:30px; width:100%; text-align:center; color:#9EC9DD; font-size:21px; letter-spacing:.3em; font-weight:bold; z-index:2}
  .cc-hero{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:2; pointer-events:none}
  .cc-hero span{color:#fff; font-weight:bold; text-align:center; line-height:1.02; transition:font-size .5s; padding:0 40px}
  .cc-hero span.pop{animation:ccpop .55s}
  @keyframes ccpop{0%{transform:scale(.7); opacity:.2} 100%{transform:scale(1); opacity:1}}
  .cc-orbit span{position:absolute; color:#9EC9DD; font-weight:bold; white-space:nowrap; transition:all .7s; opacity:.85; z-index:1}
  .cc-total{position:absolute; bottom:22px; width:100%; text-align:center; color:#9EC9DD; font-size:21px; z-index:2}
  .qflash{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;border-radius:14px;padding:14px 26px;font-size:20px;max-width:80%;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:.4s}
  .qflash.show{opacity:1}
</style>
</head>
<body>
<header>
  <div>
    <div class="t1">Ministerio de Trabajo PBA · Cooperación Argentina — Guatemala</div>
    <div class="t2">Inspección del trabajo en casas particulares</div>
  </div>
  <div class="right" id="hdrRight">Sumate: <b id="hdrUrl"></b></div>
</header>
<main id="main"></main>
<footer>
  <div id="fConn">0 participantes en la sala</div>
  <div style="font-size:17px;opacity:.85">Argentina y Guatemala · una sala compartida</div>
</footer>
<div class="qflash" id="qflash"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({transports:['websocket','polling']});
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
let ACT=[], current=null, revealed=false, liveWC=false;
document.getElementById('hdrUrl').textContent = location.host;

function staffJoin(){
  socket.emit('staffJoin',{token, role:'pantalla'}, res=>{
    if(!res.ok){ document.getElementById('main').innerHTML='<div class="waiting"><div class="big">Token inválido</div><p>Abrí esta pantalla como /pantalla.html?token=…</p></div>'; return; }
    ACT=res.activities; current=res.current; revealed=res.revealed; liveWC=!!res.liveWC;
    if(current) renderLive(res.agg); else renderWaiting(res.stats?res.stats.total:0);
  });
}
socket.on('connect', staffJoin);

function renderWaiting(n){
  document.getElementById('main').innerHTML = `
  <div class="waiting">
    <div class="big">Sumate a la sala interactiva desde tu celular</div>
    <div class="url">${location.host}</div>
    <div class="counter"><b id="wN">${n??0}</b> personas ya están adentro</div>
  </div>`;
}

function findAct(id){ return ACT.find(a=>a.id===id); }

socket.on('activity', d=>{ current=d.activity; revealed=false; liveWC=false; ccSpans={}; ccHeroWord=null; renderLive(null); });
socket.on('liveWC', d=>{ liveWC=true; });
socket.on('results', d=>{
  if(!current || d.activityId!==current.id) return;
  if(current.type==='wordcloud' && (d.liveWC||d.revealed)){
    liveWC = liveWC || !!d.liveWC;
    if(document.getElementById('cloudC')) { updateCloudC(d.agg, !!d.revealed); const l=document.getElementById('ccLabel'); if(l) l.textContent=d.revealed?'LA PALABRA DE LA SALA':'LA SALA ESTÁ ESCRIBIENDO…'; }
    else renderLive(d.agg, d.revealed);
    return;
  }
  renderLive(d.agg, d.revealed);
});
socket.on('revealed', d=>{ revealed=true; if(current&&d.activityId===current.id){ current=d.activity; renderLive(d.agg,true);} });
socket.on('idle', ()=>{ current=null; revealed=false; renderWaiting(lastTotal); });

let lastTotal=0;
socket.on('stats', s=>{
  lastTotal=s.total;
  document.getElementById('fConn').textContent = `${s.total} participantes en la sala`;
  const w=document.getElementById('wN'); if(w) w.textContent=s.total;
});

function renderLive(agg, rev){
  rev = rev ?? revealed;
  const act=current;
  let html=`<div class="bloque">${esc(act.bloque)}</div><h1>${esc(act.title)}</h1>`;
  const total = agg? agg.total : 0;

  if(act.type==='wordcloud' && (liveWC || rev) ){
    html += `<div style="flex:1; padding:6px 0">
      <div class="cloudC" id="cloudC">
        <div class="deco1"></div><div class="deco2"></div>
        <div class="cc-label" id="ccLabel">${rev?'LA PALABRA DE LA SALA':'LA SALA ESTÁ ESCRIBIENDO…'}</div>
        <div class="cc-orbit" id="ccOrbit"></div>
        <div class="cc-hero"><span id="ccHero"></span></div>
        <div class="cc-total" id="ccTotal"></div>
      </div></div>`;
    document.getElementById('main').innerHTML = html;
    ccSpans={}; ccHeroWord=null;
    if(agg) updateCloudC(agg, rev);
    return;
  }
  if(!agg || (!rev && (act.type==='quiz'||act.type==='poll'))){
    // antes del reveal: solo contador de respuestas (sin sesgar a la sala)
    html += `<div class="waiting" style="flex:1">
      <div class="counter">Respondé desde tu celular</div>
      <div class="big" style="font-size:96px" id="liveN">${total}</div>
      <div class="counter">respuestas recibidas</div></div>`;
  }
  else if(agg.type==='quiz'||agg.type==='poll'){
    const opts = act.options || [];
    const max=Math.max(1,...agg.counts);
    html += `<div class="bars">` + agg.counts.map((n,i)=>`
      <div class="brow">
        <div class="lab"><span>${rev&&i===agg.correct?'✓ ':''}${esc(opts[i]??('Opción '+(i+1)))}</span>
        <span class="r">${agg.total?Math.round(n/agg.total*100):0}%</span></div>
        <div class="bar"><div class="${rev&&i===agg.correct?'c':''}" style="width:${Math.max(4,Math.round(n/max*100))}%">${n}</div></div>
      </div>`).join('') + `</div>`;
    if(rev && agg.explain) html += `<div class="explain">${esc(agg.explain)}</div>`;
  }
  else if(agg.type==='pollCountry'){
    const opts = act.options || [];
    const m=Math.max(1,...(agg.counts||[1]));
    html += `<div class="bars">` + (agg.counts||[]).map((n,i)=>`
      <div class="brow">
        <div class="lab"><span>${esc(opts[i]??('Opción '+(i+1)))}</span>
        <span class="r">${agg.total?Math.round(n/agg.total*100):0}%</span></div>
        <div class="bar"><div style="width:${Math.max(4,Math.round(n/m*100))}%">${n}</div></div>
      </div>`).join('') + `</div>
      <p style="color:#5a6b7d;font-size:18px;margin-top:14px">La respuesta de toda la sala — Argentina y Guatemala</p>`;
  }
  else if(agg.type==='classify'){
    html += `<table class="heat"><tr><th style="text-align:left">Infracción</th>${agg.categories.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`;
    html += agg.cards.map(c=>{
      const row=agg.heat[c.id]; const tot=row.reduce((x,y)=>x+y,0)||1;
      return `<tr><td class="lbl">${esc(c.text)}</td>${row.map((n,ci)=>{
        const pct=Math.round(n/tot*100);
        let bg = `rgba(59,100,145,${pct/130})`;
        if(rev && ci===c.correct) bg=`rgba(46,125,79,${0.2+pct/120})`;
        return `<td style="background:${bg}">${rev&&ci===c.correct?'✓ ':''}${pct}%</td>`;
      }).join('')}</tr>`;
    }).join('')+`</table>`;
    if(rev && agg.explain) html += `<div class="explain">${esc(agg.explain)}</div>`;
  }

  document.getElementById('main').innerHTML = html;
}
const CC_SLOTS = [
  {l:'7%', t:'20%'},{l:'70%', t:'17%'},{l:'9%', t:'70%'},{l:'68%', t:'72%'},
  {l:'34%', t:'9%'},{l:'36%', t:'84%'},{l:'3%', t:'45%'},{l:'84%', t:'45%'}
];
const CC_SIZES = [46,42,38,35,31,29,27,25];
let ccSpans = {}, ccHeroWord = null;
function updateCloudC(agg, final){
  if(!agg || agg.type!=='wordcloud') return;
  const words = agg.words || [];
  const hero = document.getElementById('ccHero');
  const orbit = document.getElementById('ccOrbit');
  if(!hero || !orbit) return;
  if(words.length){
    const w = words[0][0];
    hero.style.fontSize = Math.max(70, 170 - Math.max(0,w.length-8)*9)+'px';
    if(ccHeroWord!==w){ hero.textContent=w; hero.classList.remove('pop'); void hero.offsetWidth; hero.classList.add('pop'); ccHeroWord=w; }
  }
  const top = words.slice(1, 1+CC_SLOTS.length);
  const vivos = new Set(top.map(x=>x[0]));
  for(const [word] of Object.entries(ccSpans)) if(!vivos.has(word)){ ccSpans[word].remove(); delete ccSpans[word]; }
  top.forEach(([word], i)=>{
    let sp = ccSpans[word];
    if(!sp){ sp=document.createElement('span'); sp.textContent=word; sp.style.opacity='0'; orbit.appendChild(sp); ccSpans[word]=sp;
      requestAnimationFrame(()=>{ sp.style.opacity='.85'; }); }
    sp.style.left=CC_SLOTS[i].l; sp.style.top=CC_SLOTS[i].t; sp.style.fontSize=CC_SIZES[i]+'px';
  });
  const tt=document.getElementById('ccTotal');
  if(tt) tt.textContent = agg.total + (agg.total===1?' palabra':' palabras') + ' de la sala · Argentina y Guatemala';
}
function bar(label,n,max){
  return `<div class="brow"><div class="lab"><span>${esc(label)}</span><span class="r">${n}</span></div>
  <div class="bar"><div style="width:${Math.max(4,Math.round(n/max*100))}%">${n}</div></div></div>`;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
</script>
</body>
</html>
