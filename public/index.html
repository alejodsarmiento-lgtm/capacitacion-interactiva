<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Capacitación · Inspección en casas particulares</title>
<style>
  :root{
    --navy:#1E3A68; --navy2:#16304F; --cele:#56A8C2; --cele2:#7FD1EA; --ice:#EAF4F9;
    --line:#DDE7EF; --txt:#22384f; --mut:#5a6b7d;
    --ok:#2e7d4f; --okbg:#4caf7d; --warn:#e0b83a; --bad:#e57358; --badtx:#b3402a;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{font-family:-apple-system,'Segoe UI',Arial,Helvetica,sans-serif; background:var(--navy); color:var(--txt);
       min-height:100vh; display:flex; flex-direction:column; position:relative; overflow-x:hidden}
  .bgdeco{position:fixed; inset:0; z-index:0; pointer-events:none}
  .bgdeco .c1{position:absolute; top:-130px; right:-130px; width:340px; height:340px; border-radius:50%; background:#2B4E85; opacity:.85}
  .bgdeco .c2{position:absolute; bottom:40px; left:-150px; width:400px; height:400px; border-radius:50%; background:var(--cele); opacity:.18}

  header{position:relative; z-index:2; padding:16px 20px 10px; color:#fff}
  header .t1{font-size:11px; letter-spacing:.16em; color:#9EC9DD; font-weight:bold}
  header .t2{font-size:16px; font-weight:bold; margin-top:2px}
  .prog{position:relative; z-index:2; margin:0 20px; height:5px; background:rgba(255,255,255,.18); border-radius:3px; overflow:hidden}
  .prog div{height:100%; width:0; background:var(--cele2); border-radius:3px; transition:width .5s}
  .prog.hide{opacity:0}

  main{position:relative; z-index:1; flex:1; padding:16px 14px 190px; max-width:560px; width:100%; margin:0 auto}
  .card{background:#fff; border-radius:22px; padding:20px 18px; margin-bottom:14px; box-shadow:0 12px 30px rgba(8,20,40,.35)}
  .bloque{display:inline-block; background:var(--ice); color:#2B6C8C; font-size:10.5px; font-weight:bold;
          letter-spacing:.08em; text-transform:uppercase; border-radius:12px; padding:5px 12px}
  h2{font-size:18px; color:var(--navy2); margin:12px 0 16px; line-height:1.35}
  .hint{font-size:13px; color:var(--mut); margin-bottom:12px}
  button{font-family:inherit; cursor:pointer}

  .opt{display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line);
       border-radius:16px; padding:14px; font-size:14.5px; margin-bottom:10px; color:var(--txt); line-height:1.35; transition:.15s}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--navy); background:var(--navy); color:#fff; font-weight:bold; box-shadow:0 6px 16px rgba(30,58,104,.35)}
  .opt.correct{border-color:var(--ok); background:#e7f5ec; color:#1d4d33; font-weight:bold}
  .opt.wrong{border-color:var(--bad); background:#fbeae5; color:var(--badtx)}
  .opt[disabled]{cursor:default}
  .opt small{font-weight:normal; opacity:.85}

  .send{width:100%; background:var(--cele); color:#fff; border:none; border-radius:16px; padding:15px;
        font-size:15.5px; font-weight:bold; margin-top:4px; box-shadow:0 8px 18px rgba(86,168,194,.4); transition:.15s}
  .send:active{transform:scale(.985)}
  .send[disabled]{opacity:.45; box-shadow:none}

  input[type=text]{width:100%; border:2px solid var(--line); border-radius:14px; padding:13px; font-size:16px; font-family:inherit; background:#fff}
  input[type=text]:focus{outline:none; border-color:var(--cele)}
  select{width:100%; border:2px solid var(--line); border-radius:14px; padding:13px; font-size:16px; background:#fff; font-family:inherit}
  label{display:block; font-size:12.5px; font-weight:bold; color:var(--navy); margin:14px 0 6px; letter-spacing:.02em}
  .pais-row{display:flex; gap:10px}
  .pais-row button{flex:1; padding:14px; border-radius:14px; border:2px solid var(--line); background:#fff; font-size:15.5px}
  .pais-row button.sel{border-color:var(--navy); background:var(--navy); color:#fff; font-weight:bold}

  .status{text-align:center; padding:28px 10px; color:var(--mut); font-size:15px; line-height:1.55}
  .badge-ok{display:inline-block; background:#e7f5ec; color:var(--ok); border-radius:20px; padding:7px 16px; font-weight:bold; font-size:14px}
  .explain{background:var(--ice); border-left:4px solid var(--cele); padding:12px 14px; font-size:14px;
           border-radius:0 12px 12px 0; margin-top:12px; line-height:1.45; color:#2a4356}

  .ccard{border:2px solid var(--line); border-radius:16px; padding:12px 13px; margin-bottom:11px; background:#fff; transition:.15s}
  .ccard .txt{font-size:14px; margin-bottom:9px; line-height:1.35}
  .seg{display:flex; gap:7px}
  .seg button{flex:1; padding:10px 4px; font-size:12.5px; border-radius:12px; border:2px solid var(--line); background:#F5F8FB; color:var(--txt)}
  .seg button.sel{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:bold}
  .ccard.rev-ok{border-color:var(--okbg); background:#f4fbf7}
  .ccard.rev-bad{border-color:var(--bad); background:#fdf4f1}
  .rev-tag{font-size:12.5px; font-weight:bold; margin-top:7px}

  .bottom{position:fixed; bottom:0; left:0; right:0; background:#fff; border-radius:22px 22px 0 0;
          box-shadow:0 -10px 28px rgba(8,20,40,.35); z-index:20; max-width:560px; margin:0 auto}
  .tabs{display:flex; padding-top:6px}
  .tabs button{flex:1; padding:10px 4px 8px; border:none; background:transparent; font-size:12.5px; color:var(--mut); border-bottom:3px solid transparent; font-weight:bold}
  .tabs button.on{color:var(--navy); border-bottom-color:var(--cele)}
  .semlbl{font-size:12px; color:var(--mut); text-align:center; margin:10px 0 9px}
  .sems{display:flex; gap:8px; justify-content:center; padding:0 16px 16px}
  .pill{border:none; border-radius:20px; padding:12px 4px; font-size:12.5px; font-weight:bold; flex:1; max-width:118px; transition:.15s; color:#fff}
  .pill:active{transform:scale(.96)}
  .pill.v{background:#e7f5ec; color:#2e7d4f}
  .pill.a{background:#faf3d9; color:#8a6d00}
  .pill.r{background:#fbeae5; color:#b3402a}
  .pill.v.on{background:#4caf7d; color:#fff; box-shadow:0 0 0 3px rgba(76,175,125,.3)}
  .pill.a.on{background:#e8bd2f; color:#fff; box-shadow:0 0 0 3px rgba(232,189,47,.3)}
  .pill.r.on{background:#e57358; color:#fff; box-shadow:0 0 0 3px rgba(229,115,88,.3)}

  .qpanel{max-height:44vh; overflow-y:auto; padding:12px 16px; border-top:1px solid #EFF3F7}
  .qrow{display:flex; gap:10px; align-items:flex-start; border-bottom:1px solid #F2F5F8; padding:10px 0}
  .qrow .vt{min-width:48px; text-align:center; border:2px solid var(--line); border-radius:12px; padding:6px 0; font-size:13px; background:var(--ice); font-weight:bold; color:var(--navy)}
  .qrow .vt.mine{border-color:var(--cele); background:var(--cele); color:#fff}
  .qrow .tx{font-size:14px; line-height:1.35}
  .qrow .meta{font-size:11.5px; color:var(--mut); margin-top:2px}
  .qrow.ans{opacity:.5}
  .qform{display:flex; gap:8px; padding:10px 16px 14px; border-top:1px solid #EFF3F7}
  .qform input{flex:1}
  .qform button{background:var(--navy); color:#fff; border:none; border-radius:14px; padding:0 18px; font-weight:bold; font-size:14px}

  .toast{position:fixed; top:70px; left:50%; transform:translateX(-50%); background:var(--navy2); color:#fff;
         padding:10px 20px; border-radius:22px; font-size:14px; z-index:50; opacity:0; transition:.25s; pointer-events:none;
         box-shadow:0 8px 20px rgba(8,20,40,.4); white-space:nowrap}
  .toast.show{opacity:1}
  .wcloud{text-align:center; padding:12px 0}
  .wcloud span{margin:4px 6px; display:inline-block}
</style>
</head>
<body>
<div class="bgdeco"><div class="c1"></div><div class="c2"></div></div>

<header>
  <div class="t1">ARGENTINA · GUATEMALA</div>
  <div class="t2">Inspección del trabajo en casas particulares</div>
</header>
<div class="prog hide" id="prog"><div id="progFill"></div></div>

<main id="main"></main>

<div class="bottom" id="bottom" style="display:none">
  <div class="tabs">
    <button id="tabSem" class="on" onclick="showTab('sem')">🚦 Tu semáforo</button>
    <button id="tabQ" onclick="showTab('q')">💬 Preguntas <span id="qCount"></span></button>
  </div>
  <div id="panelSem">
    <div class="semlbl">Tu semáforo le marca el ritmo a la clase</div>
    <div class="sems">
      <button class="pill v" id="semV" onclick="setSem('verde')">Seguimos</button>
      <button class="pill a" id="semA" onclick="setSem('amarillo')">Más despacio</button>
      <button class="pill r" id="semR" onclick="setSem('rojo')">Repasemos</button>
    </div>
  </div>
  <div id="panelQ" style="display:none">
    <div class="qpanel" id="qList"></div>
    <div class="qform">
      <input type="text" id="qText" maxlength="240" placeholder="Escribí tu pregunta…">
      <button onclick="sendQuestion()">Enviar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({transports:['websocket','polling']});
const main = document.getElementById('main');
let me = null, current = null, myAnswer = null, sent = false, classifyState = {};

function setProgress(meta){
  const p = document.getElementById('prog');
  if(!meta){ p.classList.add('hide'); return; }
  p.classList.remove('hide');
  document.getElementById('progFill').style.width = Math.round(meta.idx/meta.total*100)+'%';
}

// ---------- Registro ----------
function renderJoin(){
  main.innerHTML = `
  <div class="card">
    <span class="bloque">Bienvenido / Bienvenida</span>
    <h2>Sumate a la sala interactiva</h2>
    <label>Tu nombre</label>
    <input type="text" id="jNombre" maxlength="40" placeholder="Nombre y apellido">
    <label>País</label>
    <div class="pais-row">
      <button id="pAR" onclick="pickPais('AR')">🇦🇷 Argentina</button>
      <button id="pGT" onclick="pickPais('GT')">🇬🇹 Guatemala</button>
    </div>
    <label>Tu rol</label>
    <select id="jRol">
      <option value="inspector">Inspector / Inspectora</option>
      <option value="funcionario">Funcionario / Funcionaria</option>
      <option value="abogado">Abogado / Abogada</option>
      <option value="otro">Otro</option>
    </select>
    <button class="send" style="margin-top:18px" onclick="join()">Ingresar</button>
  </div>`;
}
let paisSel = null;
function pickPais(p){
  paisSel = p;
  document.getElementById('pAR').classList.toggle('sel', p==='AR');
  document.getElementById('pGT').classList.toggle('sel', p==='GT');
}
function join(){
  const nombre = document.getElementById('jNombre').value.trim();
  const rol = document.getElementById('jRol').value;
  if(!nombre) return toast('Escribí tu nombre');
  if(!paisSel) return toast('Elegí tu país');
  socket.emit('join', {nombre, pais:paisSel, rol}, res=>{
    if(!res.ok) return toast(res.error||'Error');
    me = {nombre, pais:paisSel, rol};
    try{ sessionStorage.setItem('me', JSON.stringify(me)); }catch(e){}
    document.getElementById('bottom').style.display='block';
    renderQuestions(res.questions||[]);
    setProgress(res.meta||null);
    if(res.current){ current = res.current; sent=false; myAnswer=null; classifyState={};
      if(res.revealed && res.agg) renderRevealed(res.current, res.agg);
      else renderActivity(res.current);
    } else renderIdle();
  });
}

socket.on('connect', ()=>{
  if(me){
    socket.emit('join', me, res=>{
      if(res && res.ok){
        setProgress(res.meta||null);
        if(res.current){ current=res.current;
          if(res.revealed && res.agg) renderRevealed(res.current,res.agg); else renderActivity(res.current);
        } else renderIdle();
      }
    });
  }
});

function renderIdle(){
  current=null;
  setProgress(null);
  main.innerHTML = `
  <div class="card status">
    <span class="badge-ok">✓ Estás en la sala</span>
    <p style="margin-top:15px">Seguí la presentación en Webex.<br>Cuando se abra una actividad, va a aparecer acá automáticamente.</p>
  </div>`;
}

// ---------- Actividades ----------
function renderActivity(act){
  sent=false; myAnswer=null; classifyState={};
  let inner = `<span class="bloque">${esc(act.bloque)}</span><h2>${esc(act.title)}</h2>`;
  if(act.type==='quiz' || act.type==='poll'){
    inner += act.options.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pickOpt(${i})">${esc(o)}</button>`).join('');
    inner += `<button class="send" id="btnSend" disabled onclick="sendAnswer()">Enviar respuesta</button>`;
  } else if(act.type==='wordcloud'){
    inner += `<div class="hint">${esc(act.subtitle||'')}</div>
      <input type="text" id="wcInput" maxlength="24" placeholder="Una palabra…">
      <button class="send" style="margin-top:12px" id="btnSend" onclick="sendWord()">Enviar</button>`;
  } else if(act.type==='classify'){
    inner += `<div class="hint">Tocá la opción que creés correcta en cada caso.</div>`;
    inner += act.cards.map(c=>`
      <div class="ccard" id="cc_${c.id}">
        <div class="txt">${esc(c.text)}</div>
        <div class="seg">
          ${act.categories.map((cat,ci)=>`<button id="cc_${c.id}_${ci}" onclick="pickCat('${c.id}',${ci})">${esc(cat)}</button>`).join('')}
        </div>
      </div>`).join('');
    inner += `<button class="send" id="btnSend" disabled onclick="sendClassify()">Enviar respuestas</button>`;
  }
  main.innerHTML = `<div class="card">${inner}</div>`;
  window.scrollTo(0,0);
}

function pickOpt(i){
  if(sent) return;
  myAnswer = i;
  current.options.forEach((_,j)=>document.getElementById('opt'+j).classList.toggle('sel', j===i));
  document.getElementById('btnSend').disabled = false;
}
function sendAnswer(){
  if(myAnswer===null||sent) return;
  lockSend();
  socket.emit('respond', {activityId:current.id, value:myAnswer}, res=>{
    if(res.ok){ toast('Respuesta enviada ✓'); }
    else { unlockSend(); toast(res.error||'Error'); }
  });
}
function sendWord(){
  const w = document.getElementById('wcInput').value.trim();
  if(!w) return toast('Escribí una palabra');
  lockSend();
  socket.emit('respond', {activityId:current.id, value:w}, res=>{
    if(res.ok) toast('¡Enviada! ✓'); else { unlockSend(); toast(res.error||'Error'); }
  });
}
function pickCat(cardId, ci){
  if(sent) return;
  classifyState[cardId]=ci;
  current.categories.forEach((_,j)=>{
    document.getElementById(`cc_${cardId}_${j}`).classList.toggle('sel', j===ci);
  });
  document.getElementById('btnSend').disabled = Object.keys(classifyState).length < current.cards.length;
}
function sendClassify(){
  lockSend();
  socket.emit('respond', {activityId:current.id, value:classifyState}, res=>{
    if(res.ok) toast('Respuestas enviadas ✓'); else { unlockSend(); toast(res.error||'Error'); }
  });
}
function lockSend(){ sent=true; const b=document.getElementById('btnSend'); if(b){b.disabled=true;b.textContent='Enviado ✓';} }
function unlockSend(){ sent=false; const b=document.getElementById('btnSend'); if(b){b.disabled=false;} }

// ---------- Reveal ----------
function renderRevealed(act, agg){
  let inner = `<span class="bloque">${esc(act.bloque)} — Resultados</span><h2>${esc(act.title)}</h2>`;
  if(agg.type==='quiz'||agg.type==='poll'){
    const max = Math.max(1,...agg.counts);
    inner += act.options.map((o,i)=>{
      const pct = agg.total? Math.round(agg.counts[i]/agg.total*100):0;
      let cls='opt';
      if(agg.correct!==undefined && agg.correct!==null){
        if(i===agg.correct) cls+=' correct';
        else if(myAnswer===i) cls+=' wrong';
      } else if(myAnswer===i) cls+=' sel';
      const barColor = (agg.correct!==undefined && agg.correct!==null && i===agg.correct) ? '#4caf7d' : '#9db3c9';
      return `<button class="${cls}" disabled>
        ${esc(o)}<br><small>${agg.counts[i]} respuestas · ${pct}%</small>
        <div style="height:6px;background:${barColor};width:${Math.round(agg.counts[i]/max*100)}%;border-radius:3px;margin-top:6px"></div>
      </button>`;
    }).join('');
    if(agg.explain) inner += `<div class="explain">${esc(agg.explain)}</div>`;
  }
  else if(agg.type==='pollCountry'){
    inner += `<div class="hint">Así respondió cada país</div>`;
    inner += act.options.map((o,i)=>{
      const a=agg.AR[i]||0, g=agg.GT[i]||0;
      return `<div style="margin-bottom:13px"><b style="font-size:14px;color:var(--navy2)">${esc(o)}</b>
        <div style="font-size:13px;margin-top:3px;color:var(--mut)">🇦🇷 ${a} &nbsp;·&nbsp; 🇬🇹 ${g}</div></div>`;
    }).join('');
  }
  else if(agg.type==='classify'){
    inner += act.cards.map(c=>{
      const mine = classifyState[c.id];
      const ok = mine===c.correct;
      return `<div class="ccard ${mine!==undefined?(ok?'rev-ok':'rev-bad'):''}">
        <div class="txt">${esc(c.text)}</div>
        <div class="rev-tag" style="color:${ok?'var(--ok)':'var(--badtx)'}">
          ${mine!==undefined ? (ok?'✓ Correcto':'✗') : ''} Respuesta: <b>${esc(agg.categories[c.correct])}</b>
        </div>
      </div>`;
    }).join('');
    if(agg.explain) inner += `<div class="explain">${esc(agg.explain)}</div>`;
  }
  else if(agg.type==='wordcloud'){
    inner += `<div class="wcloud">` + agg.words.map(([w,n],i)=>{
      const size = 13 + Math.min(22, n*4);
      return `<span style="font-size:${size}px;color:${i%2?'var(--cele)':'var(--navy)'};font-weight:${n>1?'bold':'normal'}">${esc(w)}</span>`;
    }).join('') + `</div>`;
  }
  main.innerHTML = `<div class="card">${inner}</div>`;
}

// ---------- Sockets entrantes ----------
socket.on('activity', d=>{ current=d.activity; setProgress(d.meta||null); renderActivity(d.activity); });
socket.on('revealed', d=>{ if(current&&d.activityId===current.id){ renderRevealed(d.activity, d.agg); } });
socket.on('results', d=>{ /* los participantes ven resultados recién en el reveal */ });
socket.on('idle', d=>{ renderIdle(); });
socket.on('questions', renderQuestions);

// ---------- Semáforo ----------
let semCur=null;
function setSem(c){
  semCur=c;
  socket.emit('semaforo', c);
  document.getElementById('semV').classList.toggle('on', c==='verde');
  document.getElementById('semA').classList.toggle('on', c==='amarillo');
  document.getElementById('semR').classList.toggle('on', c==='rojo');
}

// ---------- Preguntas ----------
function showTab(t){
  document.getElementById('tabSem').classList.toggle('on', t==='sem');
  document.getElementById('tabQ').classList.toggle('on', t==='q');
  document.getElementById('panelSem').style.display = t==='sem'?'block':'none';
  document.getElementById('panelQ').style.display = t==='q'?'block':'none';
}
function sendQuestion(){
  const inp=document.getElementById('qText');
  const text=inp.value.trim();
  if(text.length<5) return toast('Escribí tu pregunta completa');
  socket.emit('question',{text},res=>{
    if(res.ok){ inp.value=''; toast('Pregunta enviada ✓'); }
    else toast(res.error||'Error');
  });
}
function renderQuestions(list){
  document.getElementById('qCount').textContent = list.length? `(${list.filter(q=>!q.answered).length})` : '';
  const el=document.getElementById('qList');
  if(!el) return;
  el.innerHTML = list.length? list.map(q=>`
    <div class="qrow ${q.answered?'ans':''}">
      <button class="vt" onclick="socket.emit('voteQuestion',${q.id})">▲ ${q.votes}</button>
      <div><div class="tx">${esc(q.text)}</div>
      <div class="meta">${q.pais==='AR'?'🇦🇷':'🇬🇹'} ${esc(q.autor)} ${q.answered?'· respondida':''}</div></div>
    </div>`).join('') : '<div class="status" style="padding:14px">Todavía no hay preguntas. ¡Hacé la primera!</div>';
}

// ---------- util ----------
function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
renderJoin();
</script>
</body>
</html>
